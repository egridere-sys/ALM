<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b5cd6">
<title>200 Nomen-Verb-Verbindungen · Almanca Kalıp Atölyesi</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--tx:#1b2333;--mut:#667189;--bd:#e2e7f1;--pri:#2b5cd6;--pri2:#e8efff;--ok:#16a34a;--ok2:#e3f7ea;--bad:#e5484d;--bad2:#fde8e9;--warn:#d97706;--der:#2563eb;--die:#db2777;--das:#16a34a;--pl:#6b7280;--vb:#c2410c;--sh:0 2px 12px rgba(20,30,60,.08)}
[data-theme=dark]{--bg:#0e131f;--card:#172033;--tx:#e8ecf5;--mut:#93a0b8;--bd:#26324b;--pri:#7aa0ff;--pri2:#1c2a4d;--ok:#3ddc84;--ok2:#12301f;--bad:#ff7075;--bad2:#3a1a1e;--warn:#fbbf24;--der:#6ea8ff;--die:#ff7ab8;--das:#4ade80;--pl:#9ca3af;--vb:#fb923c;--sh:0 2px 12px rgba(0,0,0,.45)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
header h1{font-size:17px;margin:0;flex:1;line-height:1.2}
header h1 small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.ib{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;width:40px;height:40px;font-size:18px;cursor:pointer}
.ib.on{background:var(--pri2);border-color:var(--pri)}
.wrap{max-width:860px;margin:0 auto;padding:14px}
.view{display:none}.view.on{display:block;animation:fi .25s}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom)}
nav button{border:0;background:none;color:var(--mut);padding:8px 2px 7px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
nav button span{font-size:21px;line-height:1.1}
nav button.on{color:var(--pri);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
.card h2,.card h3{margin:0 0 8px}
h2{font-size:20px}h3{font-size:17px}
.mut{color:var(--mut)}.sm{font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:480px){.grid3{grid-template-columns:1fr 1fr}}
.stat{background:var(--pri2);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--pri)}
.stat span{font-size:12px;color:var(--mut)}
.btn{border:0;background:var(--pri);color:#fff;border-radius:14px;padding:12px 16px;font-size:15px;font-weight:600;cursor:pointer;min-height:46px}
.btn.sec{background:var(--pri2);color:var(--pri)}
.btn.ok{background:var(--ok)}.btn.bad{background:var(--bad)}.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:13px;border-radius:10px}
.btn.block{display:block;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>*{flex:0 0 auto}.row .grow{flex:1 1 auto}
.chip{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;background:var(--pri2);color:var(--pri);font-weight:600;border:1px solid transparent;cursor:default}
.chip.b{cursor:pointer}.chip.on{background:var(--pri);color:#fff}
.chip.der{background:transparent;border-color:var(--der);color:var(--der)}.chip.die{background:transparent;border-color:var(--die);color:var(--die)}.chip.das{background:transparent;border-color:var(--das);color:var(--das)}.chip.pl{background:transparent;border-color:var(--pl);color:var(--pl)}
.chip.vt{background:#fff1e6;color:var(--vb)}[data-theme=dark] .chip.vt{background:#3a2412}
input[type=text],input[type=search],select,textarea{width:100%;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:11px 12px;font-size:16px;font-family:inherit}
textarea{min-height:70px;resize:vertical}
.bar{height:9px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);border-radius:9px;transition:width .4s}
.art.der,.g-der{color:var(--der);font-weight:700}.art.die,.g-die{color:var(--die);font-weight:700}.art.das,.g-das{color:var(--das);font-weight:700}.art.pl,.g-pl{color:var(--pl);font-weight:700}
.pv{color:var(--vb);font-weight:700}.alt{color:var(--mut);font-weight:400;font-size:.85em}
.hv{color:var(--vb);font-weight:700;border-bottom:2px solid var(--vb)}
.hn{color:var(--pri);font-weight:700;background:var(--pri2);border-radius:5px;padding:0 3px}
.ha{font-weight:700;text-decoration:underline}
.hp{color:#7c3aed;font-weight:700;border-bottom:2px dotted #7c3aed}
.hr{color:var(--warn);font-weight:700;font-style:italic}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin:6px 0}
/* katalog */
.it{border:1px solid var(--bd);border-radius:14px;margin-bottom:8px;background:var(--card);overflow:hidden}
.it-h{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer}
.it-h .no{font-size:11px;color:var(--mut);min-width:26px}
.it-h .ph{flex:1;min-width:0}.it-h .ph b{font-weight:600}
.it-h .ph .tr{color:var(--mut);font-size:13px}
.tkb{border:2px solid var(--bd);background:none;border-radius:9px;width:32px;height:32px;font-size:16px;cursor:pointer;color:var(--ok);flex:0 0 auto}
.tkb.on{background:var(--ok2);border-color:var(--ok)}
.it-b{padding:4px 14px 14px;border-top:1px dashed var(--bd)}
.ana{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px;margin:10px 0}
.ana dt{color:var(--mut)}.ana dd{margin:0}
.sent{font-size:18px;line-height:1.7;margin:8px 0 2px}
/* flash */
.fc{perspective:1400px;height:min(60vh,440px);min-height:330px;position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none;margin:6px 0 14px;cursor:pointer}
.fc-in{position:absolute;inset:0;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;background:var(--card);border:1px solid var(--bd);box-shadow:var(--sh);padding:18px;display:flex;overflow:auto}
.face.back{transform:rotateY(180deg)}
.fcc{margin:auto;text-align:center;width:100%}
.fc-big{font-size:clamp(22px,6vw,30px);font-weight:700;line-height:1.3;margin:10px 0}
.fc[data-dir=r] .face{outline:4px solid var(--ok)}.fc[data-dir=l] .face{outline:4px solid var(--bad)}
.hint{font-size:12px;color:var(--mut);margin-top:12px}
.rate{display:grid;grid-template-columns:1fr 52px 52px 1fr;gap:8px}
/* quiz */
.opts{display:grid;gap:9px;margin:12px 0}
.opt{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:13px;font-size:16px;text-align:left;cursor:pointer;min-height:50px}
.opt.right{border-color:var(--ok);background:var(--ok2)}.opt.wrong{border-color:var(--bad);background:var(--bad2)}
.opt.art{text-align:center;font-weight:700;font-size:20px}
.qt{font-size:20px;font-weight:700;line-height:1.4}
.fb{border-radius:14px;padding:12px;margin-top:10px}
.fb.ok{background:var(--ok2)}.fb.bad{background:var(--bad2)}
.tok{display:inline-block;border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:11px;padding:8px 12px;margin:4px 3px;font-size:16px;cursor:pointer}
.tok.used{opacity:.25;pointer-events:none}
.slot{min-height:56px;border:2px dashed var(--bd);border-radius:14px;padding:6px;margin:8px 0}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mt button{border:2px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px;font-size:14px;min-height:56px;cursor:pointer}
.mt button.sel{border-color:var(--pri);background:var(--pri2)}.mt button.done{opacity:.2;pointer-events:none}.mt button.shake{animation:sh .35s;border-color:var(--bad)}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.mode{display:flex;gap:12px;align-items:center;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:14px;padding:12px;text-align:left;width:100%;cursor:pointer;margin-bottom:8px}
.mode span.ic{font-size:26px}.mode b{display:block}.mode small{color:var(--mut)}
/* dersler */
details{background:var(--card);border:1px solid var(--bd);border-radius:16px;margin-bottom:10px;box-shadow:var(--sh)}
details>summary{padding:14px 16px;font-weight:700;cursor:pointer;list-style:none;display:flex;gap:10px;align-items:center}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"▾";margin-left:auto;color:var(--mut)}
details[open]>summary::after{content:"▴"}
details .dbody{padding:0 16px 16px}
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border:1px solid var(--bd);padding:7px 9px;text-align:left;vertical-align:top}th{background:var(--pri2)}
.tip{background:#fff7e0;border-left:4px solid var(--warn);padding:9px 12px;border-radius:8px;margin:10px 0;font-size:14px}
[data-theme=dark] .tip{background:#33290f}
.bad-t{background:var(--bad2);border-left-color:var(--bad)}
.dlg{background:var(--pri2);border-radius:12px;padding:10px 12px;font-size:15px;margin:8px 0}
.dlg p{margin:3px 0}.dlg i{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}
.tabs button{white-space:nowrap}
#toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:99;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
dialog{border:1px solid var(--bd);border-radius:18px;background:var(--card);color:var(--tx);width:min(92vw,520px);padding:16px}
dialog::backdrop{background:rgba(0,0,0,.5)}
.vbar{display:flex;align-items:center;gap:8px;margin:5px 0;cursor:pointer}
.vbar .n{min-width:112px;font-weight:600;font-size:14px}.vbar .b{flex:1}.vbar .c{min-width:22px;text-align:right;font-size:13px;color:var(--mut)}
.nn{display:inline-block;margin:3px 4px 3px 0;padding:4px 10px;border:1px solid var(--bd);border-radius:10px;font-size:14px;background:var(--card)}
</style>
</head>
<body>
<header>
  <h1>🇩🇪 Kalıp Atölyesi<small>200 Nomen-Verb-Verbindungen · A1–B2</small></h1>
  <button class="ib" id="btnSpk" data-a="autospk" title="Otomatik sesli okuma">🔈</button>
  <button class="ib" data-a="theme" title="Tema">🌓</button>
  <button class="ib" data-a="backup" title="Yedek / Sıfırla">💾</button>
</header>
<div class="wrap">
  <section class="view" id="v-home"></section>
  <section class="view" id="v-lesson"></section>
  <section class="view" id="v-catalog"></section>
  <section class="view" id="v-cards"></section>
  <section class="view" id="v-quiz"></section>
  <section class="view" id="v-tools"></section>
</div>
<nav id="nav">
  <button data-a="go" data-v="home"><span>🏠</span>Ana</button>
  <button data-a="go" data-v="lesson"><span>👨‍🏫</span>Ders</button>
  <button data-a="go" data-v="catalog"><span>📚</span>Katalog</button>
  <button data-a="go" data-v="cards"><span>🃏</span>Kartlar</button>
  <button data-a="go" data-v="quiz"><span>🎯</span>Test</button>
  <button data-a="go" data-v="tools"><span>🧰</span>Araçlar</button>
</nav>
<div id="toast"></div>
<dialog id="dlg"><h3>💾 Yedek & Sıfırlama</h3>
<p class="sm mut">İlerlemen bu tarayıcıda saklanır. Telefon değiştirirsen "Dışa aktar" ile kodu kopyala, yeni cihazda yapıştırıp "İçe aktar"a bas.</p>
<textarea id="bk" style="min-height:120px" placeholder="Yedek kodu burada görünür / buraya yapıştır"></textarea>
<div class="row" style="margin-top:10px"><button class="btn sm" data-a="bkExp">Dışa aktar</button><button class="btn sm sec" data-a="bkImp">İçe aktar</button><button class="btn sm bad" data-a="bkReset">Tümünü sıfırla</button><button class="btn sm ghost" data-a="bkClose">Kapat</button></div></dialog>

<script id="logic">
'use strict';
/* ===================== VERİ ===================== */
// alanlar: kalıp | fiil | isim | edat | Türkçe | örnek | örnek TR | cümledeki fiil parçaları
const RAW=`das Bett machen|machen|das Bett||Yatağı toplamak|Morgens mache ich sofort das Bett.|Sabahları yatağı hemen topluyorum.|mache
den Müll rausbringen|rausbringen|der Müll||Çöpü dışarı atmak|Ich bringe jeden Abend den Müll raus.|Çöpü her akşam dışarı atıyorum.|bringe+raus
den Tisch decken|decken|der Tisch||Sofrayı kurmak|Ich decke den Tisch für das Abendessen.|Akşam yemeği için sofrayı kuruyorum.|decke
den Tisch abwischen|abwischen|der Tisch||Masayı silmek / temizlemek|Nach dem Essen wische ich den Tisch gründlich ab.|Yemekten sonra masayı iyice siliyorum.|wische+ab
das Geschirr spülen|spülen|das Geschirr||Bulaşıkları yıkamak|Nach dem Abendessen spüle ich das Geschirr.|Yemekten sonra bulaşıkları yıkıyorum.|spüle
die Küche aufräumen|aufräumen|die Küche||Mutfağı toplamak / düzenlemek|Ich räume jeden Abend die Küche auf.|Her akşam mutfağı topluyorum.|räume+auf
den Boden fegen|fegen|der Boden||Yeri süpürmek|Ich fege den Boden in der Küche.|Mutfaktaki yeri süpürüyorum.|fege
den Boden wischen|wischen|der Boden||Yeri silmek / paspaslamak|Ich wische den Boden im Badezimmer.|Banyodaki yeri siliyorum.|wische
die Fenster putzen|putzen|pl:Fenster||Pencereleri temizlemek / silmek|Am Wochenende putze ich das Küchenfenster.|Hafta sonu mutfaktaki pencereyi temizliyorum.|putze
das Fenster öffnen|öffnen|das Fenster||Pencereyi açmak|Ich öffne das Fenster, um frische Luft hereinzulassen.|Temiz hava girmesi için pencereyi açıyorum.|öffne
das Fenster schließen|schließen|das Fenster||Pencereyi kapatmak|Weil es draußen kalt ist, schließe ich das Fenster.|Dışarısı soğuk olduğu için pencereyi kapatıyorum.|schließe
das Zimmer lüften|lüften|das Zimmer||Odayı havalandırmak|Ich lüfte mein Schlafzimmer jeden Morgen.|Yatak odamı her sabah havalandırıyorum.|lüfte
die Wohnung aufräumen|aufräumen|die Wohnung||Evi / daireyi toplamak|Am Wochenende räume ich meine ganze Wohnung auf.|Hafta sonu bütün dairemi topluyorum.|räume+auf
die Tür aufmachen / öffnen|aufmachen/öffnen|die Tür||Kapıyı açmak|Ich öffne meinen Freunden die Tür.|Arkadaşlarım için kapıyı açıyorum.|öffne
die Tür abschließen|abschließen|die Tür||Kapıyı kilitlemek|Beim Verlassen der Wohnung schließe ich die Tür ab.|Evden çıkarken kapıyı kilitliyorum.|schließe+ab
das Licht anmachen / einschalten|anmachen/einschalten|das Licht||Işığı açmak / yakmak|Ich mache das Licht im Wohnzimmer an.|Oturma odasındaki ışığı açıyorum.|mache+an
das Licht ausmachen / ausschalten|ausmachen/ausschalten|das Licht||Işığı kapatmak / söndürmek|Beim Verlassen des Zimmers mache ich das Licht aus.|Odadan çıkarken ışığı kapatıyorum.|mache+aus
Wäsche waschen|waschen|die Wäsche||Çamaşır yıkamak|Ich wasche meine Wäsche meistens am Sonntag.|Çamaşırlarımı çoğunlukla pazar günü yıkıyorum.|wasche
Wäsche bügeln|bügeln|die Wäsche||Çamaşırları / elbiseleri ütülemek|Vor der Arbeit bügle ich meine Hemden.|İşe gitmeden önce gömleklerimi ütülüyorum.|bügle
das Essen zubereiten|zubereiten|das Essen||Yemek hazırlamak / pişirmek|Ich bereite ein gesundes Abendessen zu.|Sağlıklı bir akşam yemeği hazırlıyorum.|bereite+zu
das Essen servieren|servieren|das Essen||Yemek servis etmek|Ich serviere meinen Gästen das Essen.|Misafirlerime yemek servis ediyorum.|serviere
Kaffee kochen / machen|kochen/machen|der Kaffee||Kahve yapmak / demlemek|Jeden Morgen koche ich mir frischen Kaffee.|Her sabah kendime taze kahve yapıyorum.|koche
Kaffee trinken|trinken|der Kaffee||Kahve içmek|Ich trinke morgens gerne eine Tasse Kaffee.|Sabahları bir fincan kahve içmeyi seviyorum.|trinke
Wasser kochen|kochen|das Wasser||Su kaynatmak|Ich koche Wasser für den Tee.|Çay için su kaynatıyorum.|koche
den Hund füttern|füttern|der Hund||Köpeği beslemek|Ich füttere meinen Hund jeden Morgen um sieben.|Köpeğimi her sabah saat yedide besliyorum.|füttere
die Katze streicheln|streicheln|die Katze||Kediyi okşamak / sevmek|Ich streichle meine Katze auf dem Sofa.|Kedimi kanepede okşuyorum.|streichle
die Pflanzen gießen|gießen|pl:Pflanzen||Çiçekleri / bitkileri sulamak|Ich gieße meine Blumen jeden Tag.|Çiçeklerimi her gün suluyorum.|gieße
Auto fahren|fahren|das Auto||Araba kullanmak / arabayla gitmek|Ich fahre jeden Tag mit dem Auto zur Arbeit.|İşe her gün arabamla gidiyorum.|fahre
Fahrrad fahren|fahren|das Fahrrad||Bisiklet kullanmak / sürmek|Bei schönem Wetter fahre ich mit dem Fahrrad.|Güzel havalarda bisikletimi kullanıyorum.|fahre
Sport treiben / Übungen machen|treiben/machen|der Sport||Spor / egzersiz yapmak|Ich treibe zweimal pro Woche Sport.|Haftada iki kez egzersiz/spor yapıyorum.|treibe
eine Pause machen|machen|die Pause||Mola vermek / ara vermek|Nach zwei Stunden Arbeit mache ich eine kurze Pause.|İki saatlik çalışmadan sonra kısa bir mola veriyorum.|mache
Hunger haben|haben|der Hunger||Aç olmak / karnı acıkmak|Ich habe großen Hunger und koche etwas.|Karnım çok aç ve bir şeyler pişiriyorum.|habe
Durst haben|haben|der Durst||Susamış olmak / susamak|Ich habe Durst und trinke ein Glas Wasser.|Susadım ve bir bardak su içiyorum.|habe
Angst haben|haben|die Angst|vor+D|Korkmak / endişelenmek|Ich habe Angst vor Spinnen.|Örümceklerden korkuyorum.|habe
Zeit haben|haben|die Zeit||Vakti / zamanı olmak|Am Wochenende habe ich leider keine Zeit.|Hafta sonu maalesef vaktim yok.|habe
Lust haben|haben|die Lust|auf+A|Canı istemek / hevesi olmak|Ich habe heute Lust auf ein leckeres Eis.|Bugün canım lezzetli bir dondurma istiyor.|habe
Spaß haben|haben|der Spaß|an+D|Eğlenmek / keyif almak|Im Urlaub habe ich immer sehr viel Spaß.|Tatilde her zaman çok eğleniyorum.|habe
den Fernseher ausschalten|ausschalten|der Fernseher||Televizyonu kapatmak|Vor dem Schlafengehen schalte ich den Fernseher aus.|Yatmadan önce televizyonu kapatıyorum.|schalte+aus
eine Nachricht schreiben|schreiben|die Nachricht||Mesaj yazmak|Ich schreibe Anna eine kurze Nachricht.|Anna'ya kısa bir mesaj yazıyorum.|schreibe
eine Nachricht bekommen / erhalten|bekommen/erhalten|die Nachricht||Mesaj almak|Ich bekomme eine wichtige Nachricht auf mein Handy.|Cep telefonuma önemli bir mesaj alıyorum.|bekomme
eine Nachricht löschen|löschen|die Nachricht||Mesajı silmek|Ich lösche alte und unnötige Nachrichten aus dem Chat.|Sohbetten eski ve gereksiz mesajları siliyorum.|lösche
eine Nachricht speichern|speichern|die Nachricht||Mesajı kaydetmek|Wichtige Nachrichten speichere ich direkt im Chat.|Önemli mesajları doğrudan sohbete kaydediyorum.|speichere
eine Nachricht weiterleiten|weiterleiten|die Nachricht||Mesajı iletmek / yönlendirmek|Ich leite die Nachricht sofort an meinen Kollegen weiter.|Mesajı derhal meslektaşıma iletiyorum.|leite+weiter

const PREPFORMS={an:['an','am','ans'],in:['in','im','ins'],zu:['zu','zum','zur'],auf:['auf','aufs'],für:['für'],mit:['mit'],um:['um'],vor:['vor'],nach:['nach'],bei:['bei','beim'],von:['von','vom']};

function verbStems(v){
  const vi=vinfo(v); let b=vi.base; const out=[];
  if(IRR[b]) out.push(...IRR[b]);

}
const um=t=>t.replace(/ä/g,'a').replace(/ö/g,'o').replace(/ü/g,'u').replace(/ß/g,'ss');
function tag(e,text,exact){
  const toks=text.split(/\s+/).filter(Boolean);
  const low=toks.map(t=>t.replace(/[.,;:!?"„“()]/g,'').toLowerCase());
  const cls=toks.map(()=> '');
  const found={v:false,n:false,p:false};
  if(exact){ exact.forEach((v,k)=>{v=v.toLowerCase();const i=k===0?low.indexOf(v):low.lastIndexOf(v); if(i>=0){cls[i]='hv';found.v=true;}}); }

    let done=false;
    for(const v of e.verbs){ const vi=vinfo(v); const st=verbStems(v);
      const i=low.findIndex((t,j)=>!cls[j]&&st.some(s=>um(t).startsWith(um(s))));
      if(i>=0){cls[i]='hv';found.v=true;done=true;
        if(vi.t==='sep'){const k=low.lastIndexOf(vi.pre); if(k>i&&!cls[k]) cls[k]='hv'; }
        break;}
    }
  }
  const n=e.nw.toLowerCase(); let ni=-1;
  low.forEach((t,i)=>{ if(ni<0&&!cls[i]&&(n.length>=3?t.includes(n):t.startsWith(n))) ni=i; });
  if(ni<0&&n.length>6){const suf=n.slice(-5); low.forEach((t,i)=>{ if(ni<0&&!cls[i]&&t.includes(suf)) ni=i; });}
  if(ni>=0){cls[ni]='hn';found.n=true;
    for(let j=ni-1;j>=0&&j>=ni-3;j--){ if(cls[j]) break; if(ARTSET.has(low[j])){cls[j]='ha g-'+(e.g||'pl');break;} } }
  const pw=e.prep?e.prep.split('+')[0]:'';
  if(pw&&pw!=='sich'){ const forms=PREPFORMS[pw]||[pw]; const pi=low.findIndex((t,i)=>!cls[i]&&forms.includes(t)); if(pi>=0){cls[pi]='hp';found.p=true;} }
  if(e.refl){ const ri=low.findIndex((t,i)=>!cls[i]&&['mir','mich','dir','dich','sich','uns'].includes(t)); if(ri>=0) cls[ri]='hr'; }
  return {toks,cls,found};
}

const KEY='nvv200_v1';let S={};
function load(){try{S=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){S={};}
 S.prog=S.prog||{};S.tick=S.tick||{};S.fav=S.fav||{};S.hard=S.hard||{};S.notes=S.notes||{};S.daily=S.daily||{};S.set=S.set||{};S.ui=S.ui||{};S.streak=S.streak||{last:'',n:0};S.planDay=S.planDay||1;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
const Z={box:0,due:0,ok:0,bad:0};
const Pg=id=>S.prog[id]||Z;
const Pw=id=>S.prog[id]||(S.prog[id]={box:0,due:0,ok:0,bad:0});
const dayKey=(d=new Date())=>d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
function touch(){const t=dayKey();S.daily[t]=(S.daily[t]||0)+1;
 if(S.streak.last!==t){const y=new Date();y.setDate(y.getDate()-1);S.streak.n=(S.streak.last===dayKey(y))?S.streak.n+1:1;S.streak.last=t;}}
function record(id,ok){const p=Pw(id);touch();if(ok){p.ok++;if(p.box===0){p.box=1;p.due=Date.now()+864e5;}}else{p.bad++;p.box=1;p.due=Date.now();}save();}
const INT=[0,1,2,4,8,16];
function srs(id,know){const p=Pw(id);touch();
 if(know){p.ok++;p.box=p.box===0?2:Math.min(5,p.box+1);p.due=Date.now()+INT[p.box]*864e5;}
 else{p.bad++;p.box=1;p.due=Date.now();}save();}
const weak=id=>{const p=Pg(id);return S.hard[id]||(p.bad>p.ok);};
const dueList=()=>E.filter(e=>{const p=Pg(e.id);return p.box>0&&p.due<=Date.now();});
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200);}
function speak(txt){ if(!('speechSynthesis' in window))return toast('Bu cihazda sesli okuma yok');
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='de-DE';u.rate=.88;speechSynthesis.speak(u);}catch(e){} }
function scopeOpts(sel){
 return [['all','📦 Tüm 200 kalıp'],['due','⏰ Tekrar zamanı gelenler'],['new','🆕 Hiç görmediklerim'],['weak','⚠️ Zorlandıklarım'],['fav','⭐ Favorilerim'],['unticked','☐ İşaretlemediklerim'],['plan','📅 Günün planı (10 kalıp)']]
  .concat(CATS.map(c=>['cat'+c.id,c.ic+' '+c.n])).map(o=>'<option value="'+o[0]+'"'+(o[0]===sel?' selected':'')+'>'+o[1]+'</option>').join('');}
function getScope(v){
 if(v==='all')return E.slice(); if(v==='due')return dueList(); if(v==='new')return E.filter(e=>!Pg(e.id).box&&!Pg(e.id).ok&&!Pg(e.id).bad);
 if(v==='weak')return E.filter(e=>weak(e.id)); if(v==='fav')return E.filter(e=>S.fav[e.id]); if(v==='unticked')return E.filter(e=>!S.tick[e.id]);
 if(v==='plan'){const a=(S.planDay-1)*10;return E.slice(a,a+10);} if(v.startsWith('cat'))return E.filter(e=>e.cat===+v.slice(3)); return E.slice();}

const R={home:renderHome,lesson:renderLesson,catalog:renderCatalog,cards:renderCards,quiz:renderQuiz,tools:renderTools};
function go(v,opt){ $$('.view').forEach(x=>x.classList.toggle('on',x.id==='v-'+v)); $$('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v)); S.ui.view=v; R[v](opt); window.scrollTo(0,0); }
const ACT={};
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(!b)return;const h=ACT[b.dataset.a];if(h)h(b,ev);});
ACT.go=b=>go(b.dataset.v);
ACT.theme=()=>{const d=document.documentElement;const n=d.dataset.theme==='dark'?'light':'dark';d.dataset.theme=n;S.set.theme=n;save();};
ACT.autospk=()=>{S.set.auto=!S.set.auto;$('#btnSpk').classList.toggle('on',!!S.set.auto);toast(S.set.auto?'Otomatik sesli okuma açık':'Otomatik sesli okuma kapalı');save();};
ACT.spk=b=>speak(b.dataset.t);
ACT.spkId=b=>{const e=byId(+b.dataset.id);speak(b.dataset.w==='ex'?e.ex:e.main);};

ACT.bkExp=()=>{$('#bk').value=JSON.stringify(S);$('#bk').select();try{navigator.clipboard.writeText($('#bk').value);toast('Kopyalandı');}catch(e){}};
ACT.bkImp=()=>{try{const o=JSON.parse($('#bk').value);if(!o.prog)throw 0;S=o;load2();save();toast('Yedek yüklendi');$('#dlg').close();go(S.ui.view||'home');}catch(e){toast('Geçersiz yedek kodu');}};
function load2(){S.prog=S.prog||{};S.tick=S.tick||{};S.fav=S.fav||{};S.hard=S.hard||{};S.notes=S.notes||{};S.daily=S.daily||{};S.set=S.set||{};S.ui=S.ui||{};S.streak=S.streak||{last:'',n:0};S.planDay=S.planDay||1;}
ACT.bkReset=()=>{if(confirm('Tüm ilerleme silinsin mi?')){S={};load2();save();$('#dlg').close();go('home');toast('Sıfırlandı');}};

 '<div class="card"><h3>📊 Konu ilerlemesi</h3>'+CATS.map(c=>{const l=E.filter(e=>e.cat===c.id),t=l.filter(e=>S.tick[e.id]).length;return '<div style="margin:10px 0;cursor:pointer" data-a="openCat" data-c="'+c.id+'"><div class="row"><b class="grow">'+c.ic+' '+c.n+'</b><span class="sm mut">'+t+'/'+l.length+'</span></div><div class="bar"><i style="width:'+(t/l.length*100)+'%"></i></div></div>';}).join('')+'</div>';
}
ACT.planDay=b=>{S.planDay=Math.max(1,Math.min(20,S.planDay+(+b.dataset.d)));save();renderHome();};
ACT.openCat=b=>{CAT.cat=+b.dataset.c;CAT.q='';CAT.st='all';CAT.verb='';go('catalog');};
ACT.quick=b=>{const w=b.dataset.w;
 if(w==='due'){if(!dueList().length)return toast('Şimdilik tekrar bekleyen kart yok 🎉 Önce yeni kartlara bak.');S.ui.fcScope='due';go('cards',{start:1});}
 else if(w==='plan'){S.ui.fcScope='plan';go('cards',{start:1});}
 else if(w==='mix'){S.ui.qScope='all';go('quiz',{start:'mix'});}
 else if(w==='planq'){S.ui.qScope='plan';go('quiz',{start:'mix'});} };

{c:4,ctx:'Toplantı, proje, iş yeri, problem çözme. B1–B2 yazılı ve sözlü sınav temaları.',kv:'treffen · machen · finden · übernehmen · erklären',w:'<b>treffen</b> karar ve anlaşmada, <b>machen</b> öneri/plan/hata ile. <i>übernehmen</i> = sorumluluğu üstlenmek (eylem), <i>tragen</i> = taşımak (durum), <i>zeigen</i> = göstermek.',d:[['Wir haben ein Problem erkannt. Wer übernimmt die Aufgabe?','Bir sorun tespit ettik. Görevi kim üstleniyor?'],['Ich übernehme sie. Ich mache einen Plan und schlage morgen eine Lösung vor.','Ben üstleniyorum. Bir plan yapıp yarın bir çözüm öneririm.'],['Gut. Dann treffen wir die Entscheidung am Freitag.','İyi. O zaman kararı cuma günü veririz.']]},
{c:5,ctx:'Duygular, ilişkiler, hedefler, kişisel gelişim. Konuşma sınavında fikir ve duygu anlatımı.',kv:'haben · zeigen · nehmen · setzen · machen',w:'Edatlar kalıbın parçası: <i>Interesse haben an + Dat</i> ama <i>Interesse zeigen für + Akk</i>. <i>sich Sorgen machen um + Akk</i> (mir = dönüşlü Dativ).',d:[['Ich mache mir Sorgen um meine Prüfung.','Sınavım için endişeleniyorum.'],['Hab Geduld mit dir selbst. Du machst jeden Tag Fortschritte.','Kendine sabırlı ol. Her gün ilerleme kaydediyorsun.'],['Danke für deinen Rat. Ich setze mir ein klares Ziel.','Tavsiyen için teşekkürler. Kendime net bir hedef koyuyorum.']]},
{c:6,ctx:'Sınıf, sınav, sunum, tartışma. Dil kursu ve akademik ortam.',kv:'stellen · geben · halten · vorbereiten · begründen',w:'<i>Prüfung bestehen</i> (geçmek) ≠ <i>Prüfung machen</i> (girmek). <i>Rede/Präsentation halten</i>. <i>sich vorbereiten auf + Akk</i> dönüşlü ve ayrılabilir: Ich bereite mich auf … vor.',d:[['Ich bereite mich auf die B2-Prüfung vor.','B2 sınavına hazırlanıyorum.'],['Hast du schon eine Präsentation vorbereitet?','Sunumunu hazırladın mı?'],['Ja, morgen halte ich sie. Ich habe nur eine Frage zur Grammatik.','Evet, yarın yapıyorum. Sadece dilbilgisi hakkında bir sorum var.'],['Dann stell die Frage gern dem Lehrer.','O zaman soruyu öğretmene sor.']]}
];

function catFilter(){const q=CAT.q.trim().toLowerCase();

  if(CAT.st==='todo'&&S.tick[e.id])return false; if(CAT.st==='done'&&!S.tick[e.id])return false; if(CAT.st==='weak'&&!weak(e.id))return false; if(CAT.st==='fav'&&!S.fav[e.id])return false;

 }
 return h+'</div>';

 else if(m==='tr2de'){front='<div class="fcc"><span class="chip">'+c.ic+' '+c.n+'</span><div class="fc-big" style="color:var(--pri)">'+esc(e.tr)+'</div><div class="hint">Almancası? artikel + isim + fiil'+(e.prep?' + edat':'')+'</div></div>';
  back='<div class="fcc"><div class="fc-big">'+pH(e)+'</div>'+(e.prep?'<span class="chip">'+esc(prepLabel(e.prep))+'</span>':'')+backInfo(e)+tools(e.id)+'</div>';}
 else{front='<div class="fcc"><span class="chip">Boşluğa doğru fiil?</span><div class="sent" style="font-size:20px;margin:12px 0">'+clozeText(e)+'</div><div class="mut sm">'+esc(e.exTr)+'</div><div class="row" style="justify-content:center;margin-top:10px"><span class="chip">İsim: '+(e.g&&e.g!=='pl'?e.g+' ':'')+esc(e.nw)+'</span></div></div>';

function fcRate(know){
 const e=FC.q[FC.i];srs(e.id,know);
 if(know)FC.k++;else{FC.a++;FC.miss.push(e.id);FC.re[e.id]=(FC.re[e.id]||0)+1;if(FC.re[e.id]<=2){FC.q.splice(Math.min(FC.q.length,FC.i+4),0,e);}}

function swipe(){
 const el=$('#fc');if(!el)return;let sx=0,dx=0,drag=false,moved=false;
 el.addEventListener('pointerdown',ev=>{if(ev.target.closest('button'))return;sx=ev.clientX;dx=0;drag=true;moved=false;try{el.setPointerCapture(ev.pointerId);}catch(e){}el.style.transition='none';});
 el.addEventListener('pointermove',ev=>{if(!drag)return;dx=ev.clientX-sx;if(Math.abs(dx)>8)moved=true;el.style.transform='translateX('+dx+'px) rotate('+dx/30+'deg)';el.dataset.dir=dx>50?'r':dx<-50?'l':'';});
 const end=()=>{if(!drag)return;drag=false;el.style.transition='transform .25s';
  if(Math.abs(dx)>90){el.style.transform='translateX('+(dx>0?700:-700)+'px) rotate('+(dx>0?18:-18)+'deg)';setTimeout(()=>fcRate(dx>0),170);}
  else{el.style.transform='';el.dataset.dir='';if(!moved)fcFlipNow();}};
 el.addEventListener('pointerup',end);el.addEventListener('pointercancel',()=>{drag=false;el.style.transform='';el.dataset.dir='';});
}
document.addEventListener('keydown',ev=>{if(!FC.active||!$('#v-cards').classList.contains('on'))return;if(ev.target.matches('input,textarea,select'))return;

 if(mode==='mix'){const ts=['mc1','mc2','vp','vp','ord','typ'];if(artOK(e))ts.push('art');t=ts[Math.floor(Math.random()*ts.length)];}
 if(t==='art'&&!artOK(e)) t='mc1';
 const q={t,e,lock:false};
 if(t==='mc1'){const o=[];const seen=new Set([e.tr]);for(const x of shuffle(E.filter(x=>x.id!==e.id&&x.cat===e.cat)).concat(shuffle(E))){if(o.length>=3)break;if(!seen.has(x.tr)&&x.id!==e.id){seen.add(x.tr);o.push(x.tr);}}q.ans=e.tr;q.opts=shuffle([e.tr].concat(o));}
 else if(t==='mc2'){const o=[];const seen=new Set([e.main]);const c=shuffle(E.filter(x=>x.id!==e.id&&(x.noun===e.noun||x.verbs.some(v=>e.verbs.includes(v))))).concat(shuffle(E.filter(x=>x.cat===e.cat)));for(const x of c){if(o.length>=3)break;if(!seen.has(x.main)&&x.tr!==e.tr){seen.add(x.main);o.push(x.main);}}q.ans=e.main;q.opts=shuffle([e.main].concat(o));}
 else if(t==='vp'){
  const ok=new Set(e.variants.map(v=>lastWord(v)));
  const sameNoun=new Set(E.filter(x=>x.noun===e.noun).flatMap(x=>x.variants.map(lastWord)));
  const LIGHT=['machen','haben','geben','nehmen','treffen','stellen','führen','bringen','halten','setzen','tragen','finden','ziehen','zeigen','üben','übernehmen','schreiben','suchen','sammeln','gewinnen'];
  const pool2=shuffle([...new Set(LIGHT.concat(E.map(x=>lastWord(x.main))))]).filter(v=>!sameNoun.has(v)&&!ok.has(v));
  const lt=pool2.filter(v=>LIGHT.includes(v)).slice(0,2),rest=pool2.filter(v=>!lt.includes(v)).slice(0,1);
  q.ok=ok;q.ans=lastWord(e.main);q.opts=shuffle([q.ans].concat(lt,rest));

 return q;
}

 const g={sep:{},insep:{},ieren:{},simple:{}};
 E.forEach(e=>e.verbs.forEach(v=>{const t=vinfo(v).t;(g[t][v]=g[t][v]||[]).push(e);}));
 const sec=(t,title,note)=>{const ks=Object.keys(g[t]).sort((a,b)=>a.localeCompare(b,'de'));return '<div class="card"><h3>'+title+' <span class="mut sm">('+ks.length+')</span></h3><p class="sm mut" style="margin-top:0">'+note+'</p>'+ks.map(k=>'<span class="nn" data-a="verbSel2" data-v="'+k+'" style="cursor:pointer"><b class="pv">'+(t==='sep'?'<u>'+vinfo(k).pre+'</u>'+vinfo(k).base:k)+'</b></span>').join('')+'</div>';};
 $('#tbody').innerHTML='<div class="card"><h3>✂️ Ayrılan & ayrılmayan fiiller</h3><p class="sm mut" style="margin:0">Fiile dokununca örnek cümleyi görürsün. Ayrılan fiilde <u>altı çizili ön ek</u> cümle sonuna gider.</p><div id="sepEx"></div></div>'+
 sec('sep','Trennbar (ayrılır)','Ich bringe den Müll <b>raus</b>.')+sec('insep','Untrennbar (ayrılmaz)','be-, ge-, er-, ver-, ent-, über-, unter- ile başlar. Partizip\'te ge- yok.')+sec('ieren','-ieren fiilleri','Hep ayrılmaz; Partizip: kontrolliert, installiert.')+sec('simple','Basit fiiller','Ön eki olmayan temel fiiller.');
}
ACT.verbSel2=b=>{const v=b.dataset.v;const e=E.find(x=>x.verbs.includes(v));const vi=vinfo(v);$('#sepEx').innerHTML='<div class="dlg"><p><b class="pv">'+v+'</b> — '+vtLabel(v)+'</p><p>'+hl(e)+'</p><p><i>'+esc(e.exTr)+'</i></p></div>';$('#sepEx').scrollIntoView({block:'center',behavior:'smooth'});};
function tAna(){
 $('#tbody').innerHTML='<div class="card"><h3>🔬 Analizör</h3><p class="sm mut" style="margin-top:0">Bir kalıp seç: cümledeki fiil, artikel, isim ve edat renklenir; yapı çözülür. Sonra <b>kendi cümleni</b> yaz — aynı kalıbı doğru kurmuş musun kontrol edelim.</p>'+
 '<select id="anaSel">'+CATS.map(c=>'<optgroup label="'+c.ic+' '+c.n+'">'+E.filter(e=>e.cat===c.id).map(e=>'<option value="'+e.id+'"'+(S.ui.ana===e.id?' selected':'')+'>#'+e.id+' '+esc(e.main)+'</option>').join('')+'</optgroup>').join('')+'</select><div id="anaOut"></div></div>';
 $('#anaSel').onchange=anaDraw;anaDraw();
}
function anaDraw(){
 const e=byId(+$('#anaSel').value);S.ui.ana=e.id;
 $('#anaOut').innerHTML='<div style="margin-top:12px"><div class="qt">'+pH(e)+'</div><div class="mut">'+esc(e.tr)+'</div><div class="sent">'+hl(e)+'</div><div class="mut sm">'+esc(e.exTr)+'</div>'+legendHTML()+analysisHTML(e)+
 '<p class="sm" style="margin-bottom:4px"><b>✍️ Kendi cümlen:</b></p><textarea id="myS" placeholder="Bu kalıpla bir cümle yaz…"></textarea><button class="btn sm" style="margin-top:8px" data-a="anaCheck">Renklendir & kontrol et</button><div id="anaRes"></div></div>';
}
ACT.anaCheck=()=>{const e=byId(S.ui.ana);const t=$('#myS').value.trim();if(!t)return toast('Önce bir cümle yaz');
 const {found}=tag(e,t,null);const notes=[];
 notes.push(found.v?'✅ Fiil bulundu':'⚠️ Fiil bulunamadı (çekimli halini kullandın mı?)');
 notes.push(found.n?'✅ İsim bulundu ('+e.nw+')':'⚠️ İsim bulunamadı: <b>'+esc(e.nw)+'</b>');
 if(e.prep&&e.prep.split('+')[0]!=='sich')notes.push(found.p?'✅ Edat doğru: '+esc(e.prep.split('+')[0]):'⚠️ Edat eksik: <b>'+esc(prepLabel(e.prep))+'</b>');
 if(vinfo(e.verbs[0]).t==='sep')notes.push('ℹ️ Ayrılan fiil: ön ek "<b>'+vinfo(e.verbs[0]).pre+'</b>" ana cümlede sonda olmalı (yan cümlede yapışık).');
 if(e.pt==='zero')notes.push('ℹ️ Bu kalıpta isim artikelsiz; olumsuzlukta <b>kein</b> kullanılır.');
 $('#anaRes').innerHTML='<div class="fb ok" style="margin-top:10px"><div class="sent" style="font-size:17px">'+sentHTML(e,t,null)+'</div>'+notes.map(n=>'<div class="sm">'+n+'</div>').join('')+'<div class="sm mut" style="margin-top:6px">Bu bir yardımcı kontroldür; tam dilbilgisi doğrulaması yapmaz.</div></div>';
 if(found.v&&found.n){touch();save();}};

/* ===================== BAŞLAT ===================== */
load();
document.documentElement.dataset.theme=S.set.theme||(matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
$('#btnSpk').classList.toggle('on',!!S.set.auto);
go(S.ui.view&&R[S.ui.view]?S.ui.view:'home');
</script>
</body>
